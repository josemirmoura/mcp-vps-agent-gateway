version: 1
mode: full
enabled: false

# Full is a convenience preset. The capability grant stores exactly what
# the operator approved. Unrestricted network is NOT implied.
capabilities:
  - shell.admin
  - filesystem.read:any
  - filesystem.write:any
  - docker.admin
  - systemd.admin

network:
  mode: allowlist
  destinations: []
  unrestricted_requires_separate_approval: true

grant:
  required: true
  max_ttl_minutes: 60
  out_of_band_approval: true
  step_up_auth: true
