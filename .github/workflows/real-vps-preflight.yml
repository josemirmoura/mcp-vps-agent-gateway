name: real-vps-preflight

on:
  push:
    branches:
      - feat/integrated-oauth
    paths:
      - .github/workflows/real-vps-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only real VPS preflight
    runs-on: [self-hosted, linux, x64, multi-vps]
    timeout-minutes: 10
    steps:
      - name: Identify runner host
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname=$(hostname)"
          echo "kernel=$(uname -srmo)"
          echo "user=$(id -un)"
          echo "pwd=$PWD"

      - name: Check Docker and edge
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'docker_server={{.Server.Version}}'
          docker compose version
          echo "=== running containers (name image networks) ==="
          docker ps --format '{{.Names}}	{{.Image}}	{{.Networks}}' | sed -n '1,120p'
          echo "=== traefik candidates ==="
          docker ps --format '{{.ID}}	{{.Names}}	{{.Image}}	{{.Networks}}' | grep -i traefik || true
          echo "=== relevant networks ==="
          docker network ls --format '{{.Name}}' | grep -E '(^|-)traefik|public|edge' || true

      - name: Check ports and DNS
        shell: bash
        run: |
          set -euo pipefail
          echo "=== listeners 80/443 ==="
          ss -ltnp 2>/dev/null | grep -E ':(80|443)[[:space:]]' || true
          echo "=== DNS ==="
          getent ahosts mcp.josemirmoura.com.br | sed -n '1,12p' || true
          echo "=== public HTTPS probe ==="
          curl -fsSIL --max-time 10 https://mcp.josemirmoura.com.br/ | sed -n '1,20p' || true

      - name: Check existing MCP checkout without secrets
        shell: bash
        run: |
          set -euo pipefail
          for d in /opt/vps-agent-lab/mcp-vps-agent-gateway /opt/mcp-vps-agent-gateway; do
            if [ -d "$d/.git" ]; then
              echo "checkout=$d"
              git -C "$d" rev-parse --short HEAD
              git -C "$d" status --short
            fi
          done
