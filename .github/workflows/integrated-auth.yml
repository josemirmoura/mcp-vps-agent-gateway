name: integrated-auth-component-acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Prepare isolated identity stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vps-agent-auth-ci state
          cp config/policy.example.yaml config/policy.yaml
          docker network create ci-edge

          ADMIN_TOKEN="$(openssl rand -hex 32)"
          STATIC_TOKEN="$(openssl rand -hex 32)"
          MASTER_KEY="$(openssl rand -hex 16)"
          DB_SECRET="$(openssl rand -hex 24)"
          BOOTSTRAP_SECRET="T1!$(openssl rand -hex 18)"
          OPERATOR_SECRET="T2!$(openssl rand -hex 18)"
          {
            echo "VPS_AGENT_ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "VPS_AGENT_STATIC_TOKEN=$STATIC_TOKEN"
            echo "VPS_AGENT_SUBJECT=ci-placeholder"
            echo "VPS_AGENT_INSTANCE_ID=ci-integrated-auth"
            echo "VPS_AGENT_INSTANCE_NAME=ci-integrated-auth"
            echo "VPS_AGENT_SCOPE_ROOT=/tmp/vps-agent-auth-ci"
            echo "VPS_AGENT_WHOLE_HOST=0"
            echo "VPS_AGENT_AUTH_MODE=integrated"
            echo "VPS_AGENT_DOMAIN=mcp.example.invalid"
            echo "VPS_AGENT_PUBLIC_URL=https://mcp.example.invalid/mcp"
            echo "VPS_AGENT_OIDC_ISSUER=https://mcp.example.invalid"
            echo "VPS_AGENT_OIDC_AUDIENCE="
            echo "VPS_AGENT_OAUTH_RESOURCE=https://mcp.example.invalid/mcp"
            echo "VPS_AGENT_RESOURCE_METADATA_URL=https://mcp.example.invalid/.well-known/oauth-protected-resource"
            echo "VPS_AGENT_REQUIRED_SCOPES=openid"
            echo "VPS_AGENT_EDGE_NETWORK=ci-edge"
            echo "VPS_AGENT_TRAEFIK_CERTRESOLVER=letsencrypt"
            echo "VPS_AGENT_BUNDLED_PROXY=0"
            echo "ZITADEL_VERSION=v4.19.1"
            echo "ZITADEL_MASTERKEY=$MASTER_KEY"
            echo "ZITADEL_POSTGRES_DB=zitadel"
            echo "ZITADEL_POSTGRES_USER=zitadel"
            echo "ZITADEL_POSTGRES_PASSWORD=$DB_SECRET"
            echo "ZITADEL_BOOTSTRAP_ADMIN_PASSWORD=$BOOTSTRAP_SECRET"
            echo "ZITADEL_BOOTSTRAP_PAT_EXPIRATION=2099-01-01T00:00:00Z"
            echo "ZITADEL_LOGIN_PAT_EXPIRATION=2099-01-01T00:00:00Z"
            echo "CI_OPERATOR_SECRET=$OPERATOR_SECRET"
          } > .env
          chmod 600 .env config/policy.yaml

      - name: Start ZITADEL, Login UI and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -f compose.yaml -f compose.integrated-auth.yaml)
          "${COMPOSE[@]}" up -d zitadel-postgres zitadel-api zitadel-login
          for _ in $(seq 1 120); do
            api_id="$("${COMPOSE[@]}" ps -q zitadel-api)"
            login_id="$("${COMPOSE[@]}" ps -q zitadel-login)"
            api_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$api_id" 2>/dev/null || true)"
            login_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$login_id" 2>/dev/null || true)"
            if [ "$api_status" = healthy ] && [ "$login_status" = healthy ]; then
              "${COMPOSE[@]}" ps
              exit 0
            fi
            sleep 2
          done
          "${COMPOSE[@]}" logs --no-color zitadel-api zitadel-login zitadel-postgres
          exit 1

      - name: Enable DCR and create operator through real ZITADEL API
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          PAT="$(docker run --rm -v mcp-vps-agent_zitadel-bootstrap:/zitadel/bootstrap:ro alpine:3.22 cat /zitadel/bootstrap/bootstrap-admin.pat)"
          test -n "$PAT"
          echo "::add-mask::$PAT"

          curl_ci() {
            docker run --rm -i --network ci-edge curlimages/curl:8.16.0               -fsS               -H 'Host: mcp.example.invalid'               -H 'X-Forwarded-Proto: https'               "$@"
          }

          curl_ci http://zitadel-api:8080/.well-known/openid-configuration > /tmp/oidc-before.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/oidc-before.json'))
          assert x['issuer'] == 'https://mcp.example.invalid', x
          print('OIDC DISCOVERY: PASS')
          PY

          curl_ci             -X PUT http://zitadel-api:8080/v2/settings/security             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data '{"dynamicClientRegistration":{"enabled":true,"allowUnauthenticated":true}}'             > /tmp/security.json

          python3 - "$CI_OPERATOR_SECRET" <<'PY' > /tmp/operator.json
          import json,sys
          print(json.dumps({
            "userId":"ci-operator-001",
            "username":"ci-operator",
            "profile":{"givenName":"CI","familyName":"Operator","displayName":"CI Operator","preferredLanguage":"en"},
            "email":{"email":"ci-operator@example.invalid","isVerified":True},
            "password":{"password":sys.argv[1],"changeRequired":False},
          }))
          PY

          curl_ci             -X POST http://zitadel-api:8080/v2/users/human             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data-binary @-             < /tmp/operator.json             > /tmp/operator-response.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/operator-response.json'))
          assert x.get('userId') == 'ci-operator-001', x
          print('DEDICATED OPERATOR: PASS')
          PY

          curl_ci http://zitadel-api:8080/.well-known/openid-configuration > /tmp/oidc-after.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/oidc-after.json'))
          assert x.get('registration_endpoint'), x
          assert 'S256' in x.get('code_challenge_methods_supported',[]), x
          print('DCR + PKCE DISCOVERY: PASS')
          PY

          curl_ci             -X POST http://zitadel-api:8080/oauth/v2/register             -H 'Content-Type: application/json'             --data '{"client_name":"CI MCP Client","redirect_uris":["https://example.com/callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none"}'             > /tmp/dcr-client.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/dcr-client.json'))
          assert x.get('client_id'), x
          assert x.get('registration_access_token'), x
          print('REAL DYNAMIC CLIENT REGISTRATION: PASS')
          PY

      - name: Cleanup
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.integrated-auth.yaml down -v --remove-orphans || true
          docker network rm ci-edge >/dev/null 2>&1 || true
          rm -f .env config/policy.yaml
