name: public-endpoint-probe

on:
  push:
    branches:
      - feat/integrated-oauth
    paths:
      - .github/workflows/public-endpoint-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe DNS and public HTTPS
        shell: bash
        run: |
          set -u
          echo "=== DNS ==="
          getent ahosts mcp.josemirmoura.com.br || true
          echo
          for path in /healthz /.well-known/openid-configuration /.well-known/oauth-protected-resource /mcp; do
            echo "=== https://mcp.josemirmoura.com.br$path ==="
            curl -sS --max-time 12 -D - -o /tmp/body "https://mcp.josemirmoura.com.br$path" || true
            head -c 500 /tmp/body 2>/dev/null || true
            echo
          done
