name: Source release verifier unit tests

on:
  pull_request:
    paths:
      - 'scripts/verify-release-source.py'
      - 'tests/scripts/test_release_source_verifier.py'
      - 'docs/release-source-verification.md'
      - '.github/workflows/release-source-verifier-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check release verifier and regression tests
        run: python3 -m py_compile scripts/verify-release-source.py tests/scripts/test_release_source_verifier.py
      - name: Negative-path and two-signature verification contract
        run: python3 -m unittest discover -s tests/scripts -p 'test_release_source_verifier.py' -v
