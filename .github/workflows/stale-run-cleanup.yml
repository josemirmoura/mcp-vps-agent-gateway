name: stale-run-cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: stale-run-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Cancel stale runs for this branch
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$HEAD_BRANCH&per_page=100" > /tmp/runs.json
          mapfile -t stale_ids < <(
            python3 - "$CURRENT_SHA" <<'PY'
import json,sys
current=sys.argv[1]
data=json.load(open("/tmp/runs.json"))
for run in data.get("workflow_runs", []):
    if run.get("head_sha") == current:
        continue
    if run.get("status") not in {"queued","in_progress"}:
        continue
    print(run["id"])
PY
          )

          if [ "${#stale_ids[@]}" -eq 0 ]; then
            echo "No stale queued/in-progress runs for $HEAD_BRANCH."
            exit 0
          fi

          echo "Cancelling ${#stale_ids[@]} stale run(s) for $HEAD_BRANCH..."
          for run_id in "${stale_ids[@]}"; do
            echo "  cancel run $run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
          done
