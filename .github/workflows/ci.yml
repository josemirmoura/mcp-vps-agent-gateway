name: reference-implementation-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Resolve module graph
        run: go mod tidy
      - name: Format ephemeral workspace
        run: gofmt -w $(find . -name '*.go' -type f -print)
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build native commands
        run: go build ./cmd/...
      - name: Build release artifacts
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          for arch in amd64 arm64; do
            for cmd in vps-agent-gateway vps-agent-broker vps-agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/linux-$arch/$cmd" "./cmd/$cmd"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vps-agent-linux-binaries
          path: dist/
          if-no-files-found: error

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go mod tidy
      - name: Docker typed-operation smoke
        env:
          VPS_AGENT_DOCKER_SMOKE: "1"
        run: go test -count=1 -v ./internal/broker -run TestDockerCLISmoke

  systemd-unit-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Provide placeholder executables
        run: |
          sudo install -m 0755 /usr/bin/true /usr/local/bin/vps-agent-gateway
          sudo install -m 0755 /usr/bin/true /usr/local/bin/vps-agent-broker
      - name: Verify unit syntax and sandbox directives
        run: systemd-analyze verify deploy/systemd/vps-agent-gateway.service deploy/systemd/vps-agent-broker.service

  architecture-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python sim/architecture_sim.py

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go mod tidy
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...


  systemd-job-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Create sandbox execution user
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin vps-agent-exec 2>/dev/null || true
      - name: Resolve module graph
        run: go mod tidy
      - name: Run real transient systemd job
        run: |
          sudo --preserve-env=PATH env \
            VPS_AGENT_SYSTEMD_JOB_SMOKE=1 \
            GOPATH="$GOPATH" \
            GOCACHE="$GOCACHE" \
            GOMODCACHE="$GOMODCACHE" \
            go test -count=1 -run TestSystemdRunnerSmoke ./internal/jobs
