name: reference-implementation-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve module graph
        run: go mod download
      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n scripts/lib/*.sh
      - name: Validate integrated OAuth scope matching
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/oauth-scopes.sh
          audience='urn:zitadel:iam:org:project:id:123456:aud'
          vps_agent_scope_list_contains "openid $audience" openid
          vps_agent_scope_list_contains "openid $audience" "$audience"
          if vps_agent_scope_list_contains "openid" "$audience"; then
            echo "audience scope unexpectedly accepted when missing" >&2
            exit 1
          fi
          if vps_agent_scope_list_contains "$audience" openid; then
            echo "openid unexpectedly accepted when missing" >&2
            exit 1
          fi
      - name: Validate supported installation documentation
        run: python3 scripts/check-installation-contract.py
      - name: Validate delegated root policy helper
        run: bash scripts/test-delegated-roots.sh
      - name: Validate productization metadata and documentation links
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' VERSION
          bash scripts/version.sh
          bash scripts/version.sh --check
          bash scripts/install.sh --help >/dev/null
          python3 scripts/authority-summary.py --env .env.example --policy config/policy.example.yaml >/dev/null
          python3 scripts/check-doc-links.py
      - name: Validate integrated-auth Compose model
        run: bash scripts/validate-compose-model.sh
      - name: Format ephemeral workspace
        run: gofmt -w $(find . -name '*.go' -type f -print)
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build native commands
        run: go build ./cmd/...
      - name: Build release artifacts
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          for arch in amd64 arm64; do
            for cmd in vps-agent-gateway vps-agent-broker vps-agent vps-agent-mcp-call; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/linux-$arch/$cmd" "./cmd/$cmd"
            done
          done
          for arch in amd64 arm64; do
            cp LICENSE README.md README.pt-BR.md "dist/linux-$arch/"
            tar -C "dist/linux-$arch" -czf "dist/vps-agent-linux-$arch.tar.gz" .
            sha256sum "dist/vps-agent-linux-$arch.tar.gz" > "dist/vps-agent-linux-$arch.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vps-agent-linux-binaries
          path: dist/
          if-no-files-found: error

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: Docker typed-operation smoke
        env:
          VPS_AGENT_DOCKER_SMOKE: '1'
        run: go test -count=1 -v ./internal/broker -run TestDockerCLISmoke

  systemd-unit-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Provide placeholder executables
        run: |
          sudo install -m 0755 /usr/bin/true /usr/local/bin/vps-agent-gateway
          sudo install -m 0755 /usr/bin/true /usr/local/bin/vps-agent-broker
      - name: Verify unit syntax and sandbox directives
        run: systemd-analyze verify tests/fixtures/systemd/vps-agent-gateway.service tests/fixtures/systemd/vps-agent-broker.service

  architecture-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python sim/architecture_sim.py

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -fmt=json -out=gosec.json ./...
      - name: Bounded fuzzing
        run: |
          go test ./internal/securefs -run='^$' -fuzz=FuzzSelectRootNeverEscapes -fuzztime=10s
          go test ./internal/policy -run='^$' -fuzz=FuzzPolicyLoadNeverPanics -fuzztime=10s
      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          set +e
          gitleaks dir . --redact --exit-code=2 --report-format=json --report-path=results.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json
          data=json.load(open("results.json"))
          for x in data:
              print(f"{x.get('RuleID','unknown')} {x.get('File','?')}:{x.get('StartLine','?')}")
          PY
            exit "$status"
          fi
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security
          path: |
            gosec.json
            results.json
          if-no-files-found: ignore

  systemd-job-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Create sandbox execution user
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin vps-agent-exec 2>/dev/null || true
      - run: go mod download
      - name: Run real transient systemd job
        run: |
          sudo --preserve-env=PATH env \
            VPS_AGENT_SYSTEMD_JOB_SMOKE=1 \
            GOPATH="$GOPATH" \
            GOCACHE="$GOCACHE" \
            GOMODCACHE="$GOMODCACHE" \
            go test -count=1 -run TestSystemdRunnerSmoke ./internal/jobs
