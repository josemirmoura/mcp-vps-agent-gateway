        run: |
          go test ./internal/securefs -run='^    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Create sandbox execution user
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin vps-agent-exec 2>/dev/null || true
