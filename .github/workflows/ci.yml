name: reference-implementation-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve module graph
        run: go mod download
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate integrated-auth Compose model
        env:
          VPS_AGENT_ADMIN_TOKEN: ci-admin-token
          VPS_AGENT_STATIC_TOKEN: ci-static-token
          VPS_AGENT_SUBJECT: ci-operator
          VPS_AGENT_SCOPE_ROOT: /tmp/vps-agent-ci
          VPS_AGENT_AUTH_MODE: integrated
          VPS_AGENT_DOMAIN: mcp.example.invalid
          VPS_AGENT_PUBLIC_URL: https://mcp.example.invalid/mcp
          VPS_AGENT_OIDC_ISSUER: https://mcp.example.invalid
          VPS_AGENT_OAUTH_RESOURCE: https://mcp.example.invalid/mcp
          VPS_AGENT_EDGE_NETWORK: ci-edge
          VPS_AGENT_TRAEFIK_CERTRESOLVER: letsencrypt
          VPS_AGENT_LETSENCRYPT_EMAIL: ops@example.invalid
          ZITADEL_MASTERKEY: 0123456789abcdef0123456789abcdef
          ZITADEL_POSTGRES_PASSWORD: ci-postgres-password
          ZITADEL_BOOTSTRAP_ADMIN_PASSWORD: CI-Bootstrap-Password-123
          ZITADEL_BOOTSTRAP_PAT_EXPIRATION: 2099-01-01T00:00:00Z
          ZITADEL_LOGIN_PAT_EXPIRATION: 2099-01-01T00:00:00Z
        run: docker compose -f compose.yaml -f compose.integrated-auth.yaml -f compose.integrated-auth.proxy.yaml config -q
      - name: Format ephemeral workspace
        run: gofmt -w $(find . -name '*.go' -type f -print)
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build native commands
        run: go build ./cmd/...
      - name: Build release artifacts
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          for arch in amd64 arm64; do
            for cmd in vps-agent-gateway vps-agent-broker vps-agent vps-agent-mcp-call; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/linux-$arch/$cmd" "./cmd/$cmd"
            done
          done
          for arch in amd64 arm64; do
            cp LICENSE README.md README.pt-BR.md "dist/linux-$arch/"
            tar -C "dist/linux-$arch" -czf "dist/vps-agent-linux-$arch.tar.gz" .
            sha256sum "dist/vps-agent-linux-$arch.tar.gz" > "dist/vps-agent-linux-$arch.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vps-agent-linux-binaries
          path: dist/
          if-no-files-found: error

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: Docker typed-operation smoke
        env:
          VPS_AGENT_DOCKER_SMOKE: '1'
        run: go test -count=1 -v ./internal/broker -run TestDockerCLISmoke

  systemd-unit-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Provide placeholder executables
        run: |
          sudo install -m 0755 /usr/bin/true /usr/local/bin/vps-agent-gateway
          sudo install -m 0755 /usr/bin/true /usr/local/bin/vps-agent-broker
      - name: Verify unit syntax and sandbox directives
        run: systemd-analyze verify tests/fixtures/systemd/vps-agent-gateway.service tests/fixtures/systemd/vps-agent-broker.service

  architecture-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python sim/architecture_sim.py

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -fmt=json -out=gosec.json ./...
      - name: Bounded fuzzing
        run: |
          go test ./internal/securefs -run='^$' -fuzz=FuzzSelectRootNeverEscapes -fuzztime=10s
          go test ./internal/policy -run='^$' -fuzz=FuzzPolicyLoadNeverPanics -fuzztime=10s
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security
          path: gosec.json
          if-no-files-found: ignore

  systemd-job-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Create sandbox execution user
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin vps-agent-exec 2>/dev/null || true
      - run: go mod download
      - name: Run real transient systemd job
        run: |
          sudo --preserve-env=PATH env \
            VPS_AGENT_SYSTEMD_JOB_SMOKE=1 \
            GOPATH="$GOPATH" \
            GOCACHE="$GOCACHE" \
            GOMODCACHE="$GOMODCACHE" \
            go test -count=1 -run TestSystemdRunnerSmoke ./internal/jobs
