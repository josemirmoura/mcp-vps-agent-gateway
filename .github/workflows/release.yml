name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Validate source and Docker package
        run: |
          go mod tidy
          go test -race -count=1 ./...
          docker compose config -q

  images:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: gateway
            image: mcp-vps-agent-gateway
          - target: broker
            image: mcp-vps-agent-broker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

  github-release:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build Compose bundle
        run: |
          mkdir -p dist/mcp-vps-agent
          cp compose.yaml compose.https.yaml .env.example LICENSE README.md README.pt-BR.md dist/mcp-vps-agent/
          cp -r config scripts dist/mcp-vps-agent/
          mkdir -p dist/mcp-vps-agent/deploy
          cp -r deploy/caddy dist/mcp-vps-agent/deploy/
          tar -C dist -czf dist/mcp-vps-agent-docker-package.tar.gz mcp-vps-agent
          sha256sum dist/mcp-vps-agent-docker-package.tar.gz > dist/mcp-vps-agent-docker-package.tar.gz.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             dist/mcp-vps-agent-docker-package.tar.gz             dist/mcp-vps-agent-docker-package.tar.gz.sha256             --generate-notes             --title "MCP VPS Agent Gateway ${GITHUB_REF_NAME}"
