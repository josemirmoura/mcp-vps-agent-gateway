name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'SemVer tag to publish (must equal v + VERSION)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release source and VERSION
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "$expected" || {
            echo "release tag $RELEASE_TAG does not match VERSION ($expected)" >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "main" || {
              echo "manual releases must be dispatched from main" >&2
              exit 1
            }
          fi
      - name: Validate source and installation contract
        run: |
          set -euo pipefail
          go mod tidy
          go test -race -count=1 ./...
          bash -n scripts/*.sh
          bash -n scripts/lib/*.sh
          python3 scripts/check-installation-contract.py
          python3 scripts/check-doc-links.py
          bash scripts/version.sh
          bash scripts/validate-compose-model.sh


  prepare-tag:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure exact release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_sha" = "$GITHUB_SHA" || {
              echo "existing tag $RELEASE_TAG points to $tagged_sha, expected $GITHUB_SHA" >&2
              exit 1
            }
            echo "Release tag already points to this commit."
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "Created release tag $RELEASE_TAG at $GITHUB_SHA."
          else
            echo "tag event did not provide a resolvable release tag" >&2
            exit 1
          fi

  images:
    needs: prepare-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - target: gateway
            image: mcp-vps-agent-gateway
          - target: broker
            image: mcp-vps-agent-broker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.RELEASE_TAG }}
      - name: Create signed image provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  github-release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build complete source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=mcp-vps-agent/ "$GITHUB_SHA" | gzip -n > dist/mcp-vps-agent-source-package.tar.gz
          sha256sum dist/mcp-vps-agent-source-package.tar.gz > dist/mcp-vps-agent-source-package.tar.gz.sha256
          cat > dist/RELEASE-INTEGRITY.txt <<'EOF'
          Release images carry BuildKit SBOM/provenance plus a GitHub artifact attestation
          signed with a short-lived Sigstore certificate issued from GitHub OIDC identity.
          The source package carries a SHA-256 checksum and a signed GitHub provenance
          attestation. No long-lived project private signing key is stored by the project.
          Verify attestations with the GitHub CLI as documented in docs/releases.md.
          The preferred updateable installation remains a tagged Git checkout.
          EOF
      - name: Create signed source-package provenance attestation
        id: attest-source
        uses: actions/attest@v4
        with:
          subject-path: dist/mcp-vps-agent-source-package.tar.gz
      - name: Add portable Sigstore bundle to release files
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest-source.outputs.bundle-path }}" dist/mcp-vps-agent-source-package.sigstore.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "Portico MCP $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/mcp-vps-agent-source-package.tar.gz \
            dist/mcp-vps-agent-source-package.tar.gz.sha256 \
            dist/mcp-vps-agent-source-package.sigstore.json \
            dist/RELEASE-INTEGRITY.txt \
            "${flags[@]}"
