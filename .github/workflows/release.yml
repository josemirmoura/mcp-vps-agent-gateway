name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          }
      - name: Validate source and installation contract
        run: |
          go mod tidy
          go test -race -count=1 ./...
          bash -n scripts/*.sh
          bash -n scripts/lib/*.sh
          python3 scripts/check-installation-contract.py
          python3 scripts/check-doc-links.py
          bash scripts/version.sh
          docker compose config -q

  images:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: gateway
            image: mcp-vps-agent-gateway
          - target: broker
            image: mcp-vps-agent-broker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}

  github-release:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build complete source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=mcp-vps-agent/ "$GITHUB_SHA" | gzip -n > dist/mcp-vps-agent-source-package.tar.gz
          sha256sum dist/mcp-vps-agent-source-package.tar.gz > dist/mcp-vps-agent-source-package.tar.gz.sha256
          cat > dist/RELEASE-INTEGRITY.txt <<'EOF'
          Release images carry BuildKit SBOM/provenance attestations in GHCR.
          The source package is protected by the accompanying SHA-256 checksum.
          A separate project-managed cryptographic release-signing key is not yet used.
          The preferred updateable installation remains a tagged Git checkout.
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "MCP VPS Agent Gateway ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/mcp-vps-agent-source-package.tar.gz \
            dist/mcp-vps-agent-source-package.tar.gz.sha256 \
            dist/RELEASE-INTEGRITY.txt \
            "${flags[@]}"
