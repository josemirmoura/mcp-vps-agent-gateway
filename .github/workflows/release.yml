name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'SemVer tag to publish (must equal v + VERSION)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release source and VERSION
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "$expected" || {
            echo "release tag $RELEASE_TAG does not match VERSION ($expected)" >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "main" || {
              echo "manual releases must be dispatched from main" >&2
              exit 1
            }
          fi
      - name: Validate source and installation contract
        run: |
          set -euo pipefail
          go mod tidy
          go test -race -count=1 ./...
          bash -n scripts/*.sh
          bash -n scripts/lib/*.sh
          python3 scripts/check-installation-contract.py
          python3 scripts/check-doc-links.py
          bash scripts/version.sh
          bash scripts/validate-compose-model.sh

  prepare-tag:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure exact release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_sha" = "$GITHUB_SHA" || {
              echo "existing tag $RELEASE_TAG points to $tagged_sha, expected $GITHUB_SHA" >&2
              exit 1
            }
            echo "Release tag already points to this commit."
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "Created release tag $RELEASE_TAG at $GITHUB_SHA."
          else
            echo "tag event did not provide a resolvable release tag" >&2
            exit 1
          fi

  images:
    needs: prepare-tag
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: gateway
            image: mcp-vps-agent-gateway
          - target: broker
            image: mcp-vps-agent-broker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.RELEASE_TAG }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign and verify release image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          identity='^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$'
          issuer='https://token.actions.githubusercontent.com'
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer"

  github-release:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build complete source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=mcp-vps-agent/ "$GITHUB_SHA" | gzip -n > dist/mcp-vps-agent-source-package.tar.gz
          sha256sum dist/mcp-vps-agent-source-package.tar.gz > dist/mcp-vps-agent-source-package.tar.gz.sha256
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign and verify source artifacts
        shell: bash
        run: |
          set -euo pipefail
          identity='^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$'
          issuer='https://token.actions.githubusercontent.com'

          for artifact in \
            dist/mcp-vps-agent-source-package.tar.gz \
            dist/mcp-vps-agent-source-package.tar.gz.sha256
          do
            bundle="$artifact.sigstore.json"
            cosign sign-blob "$artifact" --bundle "$bundle" --yes
            cosign verify-blob "$artifact" \
              --bundle "$bundle" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer"
          done

          cat > dist/RELEASE-INTEGRITY.txt <<'EOF'
          Release images are keyless-signed with Sigstore/cosign and carry BuildKit SBOM/provenance attestations in GHCR.
          Source artifacts have SHA-256 integrity material plus Sigstore bundles produced by the GitHub Actions release workflow.
          Verification binds signatures to the Portico release workflow identity and the GitHub Actions OIDC issuer.
          The preferred updateable installation remains a tagged Git checkout.
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "Portico MCP $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/mcp-vps-agent-source-package.tar.gz \
            dist/mcp-vps-agent-source-package.tar.gz.sha256 \
            dist/mcp-vps-agent-source-package.tar.gz.sigstore.json \
            dist/mcp-vps-agent-source-package.tar.gz.sha256.sigstore.json \
            dist/RELEASE-INTEGRITY.txt \
            "${flags[@]}"
