name: dispatch-rc6-release

on:
  push:
    branches:
      - automation/dispatch-rc6
    paths:
      - .github/workflows/dispatch-rc6-release.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch validated release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f tag=v0.1.0-rc.6
          echo "Dispatched release.yml for v0.1.0-rc.6 on main."
